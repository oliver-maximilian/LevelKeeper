# One mailbox per deployment. Second mailbox: copy the project directory
# (at least this file + .env) and start it there.
# No `--env-file .env.<name>`: it only fills ${...} here, `env_file:` stays
# `.env`, so the wrong credentials get loaded. See docs/setup.md
# "Mehrere Postfächer".

services:
  levelkeeper:
    build: .
    image: levelkeeper:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # optional if everything is in .env
      - ${CONFIG_PATH:-./config/config.toml}:/config/config.toml:ro
      # state + lockfile, must survive restarts
      - ${DATA_PATH:-./data}:/data
      # NAS share, already mounted on the host (LevelKeeper never mounts)
      - ${NAS_ARCHIVE_PATH:?set NAS_ARCHIVE_PATH to the host mount of your NAS share}:/archive
    # Host cron instead: `docker compose run --rm levelkeeper --once`
    # (RUN_INTERVAL empty in .env)
