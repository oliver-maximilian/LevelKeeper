# Copy to config.toml, or use LEVELKEEPER_* env vars (they win over this file).
# Credentials preferably in .env.

[imap]
host = "imap.strato.de"
port = 993
user = "user@example.com"
password = "changeme"

[smtp]
host = "smtp.strato.de"
port = 465
user = "user@example.com"
password = "changeme"
from_addr = "user@example.com"

[quota]
# trigger/target: absolute ("1.5GB") or percent of quota ("80%"). target < trigger.
quota = "2GB"
trigger = "80%"
target = "70%"

[archive]
root = "/archive"
exclude_folders = ["Trash", "Junk", "Drafts"]
max_message_size = "25MB"
mount_marker = ".levelkeeper_mounted"

[notify]
report_recipients = ["user@example.com"]
error_recipients = ["user@example.com"]

[runtime]
log_level = "INFO"
log_format = "text"
dry_run = true
# Empty: run once and exit (host cron).
run_interval = "1h"
state_path = "/data/state.json"
lock_file = "/data/levelkeeper.lock"
# Optional push URL (Uptime Kuma), called after every successful run.
# heartbeat_url = "https://kuma.example.com/api/push/TOKEN?status=up&msg=OK"
